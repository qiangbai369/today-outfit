<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>穿搭照相馆</title>
  <meta name="theme-color" content="#eeeae2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="穿搭照相馆">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <script defer src="pwa.js"></script>
  <link rel="stylesheet" href="拆解演示.css?v=20261012-pwa1">
  <script defer src="../previews/complete-looks/data.js"></script>
  <script defer src="手势逻辑.js"></script>
  <script defer src="收藏逻辑.js?v=20261011-browse2"></script>
  <script defer src="拆解演示.js?v=20261011-browse2"></script>
</head>
<body>
  <main class="studio">
    <section id="picker" class="mobile-page">
      <header class="mobile-header"><span></span><button id="picker-favorites">收藏</button></header>
      <div id="character-choices" class="character-choices"></div>
    </section>
    <section id="favorites" class="mobile-page" hidden>
      <header class="mobile-header"><button id="favorites-back" aria-label="返回">‹</button><span>收藏</span><button id="favorites-edit" aria-pressed="false">编辑</button></header>
      <nav id="favorite-tabs" class="favorite-tabs" aria-label="收藏人物"></nav>
      <div id="favorite-photos" class="favorite-photos"></div>
      <p id="favorite-empty" class="favorite-empty" hidden>暂无收藏</p>
    </section>
    <section class="stage" id="stage" hidden aria-label="薄荷夏日穿搭">
      <button class="identity" id="character-back" aria-label="返回选角色">‹ <span id="character-name">吴心媛</span></button>
      <button class="stage-favorites" id="stage-favorites"><span id="favorite-indicator" class="favorite-indicator" hidden aria-hidden="true">♥</span>收藏</button>
      <button class="collapse" id="collapse" hidden>收起</button>
      <button class="figure" id="figure" aria-label="查看薄荷夏日穿搭拆解" aria-expanded="false" aria-controls="items" disabled>
        <img id="look-image"  alt="吴心媛身穿薄荷绿上衣与奶白小花半裙，搭配浅粉凉鞋和草编包" draggable="false">
      </button>
      <div class="items" id="items" aria-label="四件穿搭单品" aria-hidden="true" inert></div>
      <img id="heart" class="heart" src="thumbnails/heart.webp" alt="" aria-hidden="true" draggable="false">
      <p id="notice" class="notice" hidden></p><p id="status" class="sr-only" role="status" aria-live="polite"></p>
    </section>
  </main>
  <div id="feedback" class="load-feedback" role="status" hidden><span id="feedback-text"></span><button id="retry" hidden>重试</button></div>
  <div id="favorite-toast" class="favorite-toast" role="status" hidden><span>已取消收藏</span><button id="undo-favorite">撤销</button></div>
  <output id="pwa-status" class="sr-only" aria-live="polite"></output>
  <button id="pwa-action" class="pwa-action" hidden>更新</button>
  <noscript>请开启 JavaScript 查看穿搭拆解。</noscript>
</body>
</html>
