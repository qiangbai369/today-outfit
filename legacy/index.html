<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><base href="../"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="根据今天的安排寻找穿搭灵感，换单件、锁定喜欢的衣服，保存搭配与旅行行李清单。"><title>穿搭照相馆 · 旧版穿搭与旅行衣橱</title><link rel="icon" href="assets/favicon.svg"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="style-v2.css"></head><body>

 </div><div class="control-tabs" role="tablist" aria-label="穿搭操作"><button id="tab-clothes" role="tab" aria-selected="true" aria-controls="panel-clothes" tabindex="0">选衣服</button><button id="tab-wearing" role="tab" aria-selected="false" aria-controls="panel-wearing" tabindex="-1">这身搭配</button></div>
